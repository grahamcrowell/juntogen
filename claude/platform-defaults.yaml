# platform-defaults.yaml
# Curated offline fallback representing the current Claude Code platform.
# Used by Step 00 when no platform-declaration.yaml is present and introspection
# is unavailable (defaults mode). Also used as the fallback source for fields
# that introspection cannot observe (hooks, constraints, cost ratios, other models' details).
#
# VERSION: Update `version` when the platform roster changes significantly
# (new model generation, new tools, context window changes, cost ratio shifts).
# The version field enables staleness detection in Step 00.
#
# NAMING: The platform tool "Agent" is referred to as "Task tool" in spec vocabulary
# (D08–D80). See M16-derivation-architecture.md §3 for the mapping note.
#
# MODEL IDs: api_id strings are the values Claude Code accepts for the model
# parameter / settings.json. `claude-opus-5` is Anthropic's canonical identifier
# for Claude Opus 5 (short alias: `opus`); `claude-sonnet-5` for Claude Sonnet 5
# (short alias: `sonnet`); `claude-fable-5` for Claude Fable 5 (short alias:
# `fable`). Opus 5 serves 1M context natively, so it needs no `[1m]` alias form
# (the retired `opus[1m]` entry was the 1M alias of claude-opus-4-8).
#
# CAPABILITY vs POLICY: `platform.models` is a Layer 0 *capability* record - it
# states what the platform offers, and stays factually complete. Which of those
# models OpenJunto may actually spawn is a *policy* question, answered by
# `platform.model_policy`. Deleting a real platform model from the roster to
# express a policy would make the derivation input factually wrong.
#
# See: M16-derivation-architecture.md §3 for schema definition and field semantics.

version: "3.0.0"
version_date: "2026-08-07"
description: "Claude Code platform defaults - claude-opus-5 single-model default; cognitive demand expressed as effort, not model choice"

platform:
  tools:
    # --- Agent spawning (platform name: "Agent"; spec vocabulary: "Task tool") ---
    - name: "Agent"
      available: true
      parameters: ["description", "model", "plan_mode_required", "subagent_type"]

    # --- Team coordination ---
    - name: "TeamCreate"
      available: true
      parameters: ["team_name", "description"]
    - name: "TeamDelete"
      available: true
      parameters: ["team_id"]
    - name: "SendMessage"
      available: true
      parameters: ["to", "message", "summary"]

    # --- Task management ---
    - name: "TaskCreate"
      available: true
      parameters: ["subject", "description", "activeForm", "metadata"]
    - name: "TaskUpdate"
      available: true
      parameters: ["taskId", "status", "owner", "description", "subject", "activeForm", "metadata", "addBlocks", "addBlockedBy"]
    - name: "TaskList"
      available: true
      parameters: []
    - name: "TaskGet"
      available: true
      parameters: ["taskId"]

    # --- File operations ---
    - name: "Read"
      available: true
      parameters: ["file_path", "limit", "offset", "pages"]
    - name: "Edit"
      available: true
      parameters: ["file_path", "old_string", "new_string", "replace_all"]
    - name: "Write"
      available: true
      parameters: ["file_path", "content"]
    - name: "NotebookEdit"
      available: true
      parameters: ["notebook_path", "new_source", "cell_id", "cell_type", "edit_mode"]

    # --- Shell and search ---
    - name: "Bash"
      available: true
      parameters: ["command", "description", "timeout", "run_in_background", "dangerouslyDisableSandbox"]
    - name: "Glob"
      available: true
      parameters: ["pattern", "path"]
    - name: "Grep"
      available: true
      parameters: ["pattern", "path", "glob", "type", "output_mode", "context", "head_limit", "offset", "multiline", "-A", "-B", "-C", "-i", "-n"]

    # --- Meta/discovery ---
    - name: "Skill"
      available: true
      parameters: ["skill", "args"]
    - name: "ToolSearch"
      available: true
      parameters: ["query", "max_results"]

    # --- Web ---
    - name: "WebFetch"
      available: true
      parameters: ["url", "prompt"]
    - name: "WebSearch"
      available: true
      parameters: ["query", "allowed_domains", "blocked_domains"]

    # --- Git worktrees ---
    - name: "EnterWorktree"
      available: true
      parameters: ["name"]
    - name: "ExitWorktree"
      available: true
      parameters: ["action", "discard_changes"]

    # --- Scheduling (session-scoped) ---
    - name: "CronCreate"
      available: true
      parameters: ["cron", "prompt", "recurring"]
    - name: "CronDelete"
      available: true
      parameters: ["id"]
    - name: "CronList"
      available: true
      parameters: []

    # --- User interaction (non-team context only) ---
    - name: "AskUserQuestion"
      available: conditional   # available in direct sessions; not available in team sub-agent context
      parameters: ["questions", "answers", "annotations", "metadata"]  # confirmed: ToolSearch schema (2026-04-08); primary param is "questions" (array of question objects)

  models:
    # Symbolic id: used in derivation chains and human-readable references
    # api_id: actual string for Claude Code model parameter and settings.json
    # input_price_per_mtok / output_price_per_mtok: USD, first-party API rates.
    #   Replaces the former `cost_ratio` field. A ratio between models is no
    #   longer the operative cost lever - every persona runs the same model, so
    #   spend varies with effort, not model choice. Absolute prices are kept
    #   because they remain true platform facts and are what an operator needs
    #   to reason about a policy change.
    #
    # NOTE: no `tier` field. Tiers no longer bind to models; they bind to effort
    #   levels (see effort_tiers below). This is the load-bearing change.
    - id: "opus"
      api_id: "claude-opus-5"
      context_window: 1000000
      max_output_tokens: 128000
      input_price_per_mtok: 5
      output_price_per_mtok: 25
    - id: "sonnet"
      api_id: "claude-sonnet-5"
      context_window: 1000000
      max_output_tokens: 128000
      input_price_per_mtok: 3      # intro pricing $2/MTok through 2026-08-31
      output_price_per_mtok: 15
    - id: "fable"
      api_id: "claude-fable-5"
      context_window: 1000000
      max_output_tokens: 128000
      input_price_per_mtok: 10
      output_price_per_mtok: 50

  # --- Effort ladder -------------------------------------------------------
  # The tier vocabulary ({tier-routine} / {tier-implementation} /
  # {tier-reasoning}) binds HERE, not to models. Cognitive demand is expressed
  # as depth of reasoning on one model, not as a choice between models.
  #
  # `max` is Claude-specific: the Codex target's ladder tops out at `xhigh`.
  # That is exactly why the spec corpus names tiers rather than effort literals.
  effort_levels: ["low", "medium", "high", "xhigh", "max"]
  effort_tiers:
    - tier: "routine"
      effort: "high"
    - tier: "implementation"
      effort: "xhigh"
    - tier: "reasoning"
      effort: "max"

  # --- Effort binding site (a platform capability, not a policy) ------------
  # "session"  = platform exposes no per-spawn effort knob; effort is set once
  #              per session and therefore keys off ENGAGEMENT tier.
  # "per-spawn" = platform accepts an effort argument on the spawn call, so the
  #              function-first rules select effort per spawn.
  # Claude Code is "session": the Agent (Task) tool's parameters are
  # description / model / subagent_type / prompt / plan_mode_required - there is
  # no effort argument. Session effort is the settings.json `effortLevel` key
  # (equivalently the user's /effort setting).
  # Contrast: juntogen/codex/platform-defaults.yaml is "per-spawn" - its
  # subagents tool takes `model_reasoning_effort`.
  effort_binding: "session"
  session_effort_key: "effortLevel"

  # Engagement tier -> effort tier. Consulted only when effort_binding=="session".
  engagement_effort:
    simple: "routine"
    moderate: "implementation"
    complex: "reasoning"

  # --- Model policy -------------------------------------------------------
  # GENERATION-TIME INPUT, not a runtime switch. Nothing dereferences this YAML
  # while a session runs; it is read when the plugin tree is generated, and the
  # resulting prose in reference/execution-protocol.md is the behavioral
  # surface. An adopter editing the installed copy changes nothing, and the
  # installed copy is a read-only marketplace cache that /plugin replaces on
  # upgrade. To change policy on an installed plugin, use the adopter-side
  # override (see ADOPTER OVERRIDE below), not this file.
  model_policy:
    # The model every persona runs on. One model for all roles: cognitive
    # demand is expressed as effort, not as a choice between models.
    default_model: "opus"

    # Optional org policy over platform.models. Both EMPTY by default and MUST
    # ship empty: this file is part of a general artifact installed by third
    # parties, and naming a model here would impose one organization's
    # procurement policy on every adopter (Axiom 7 - no org-specific content in
    # core files). Having the knob is generic; filling it in is org-specific.
    #   allowed_models - if non-empty, an allowlist; only these may be spawned.
    #   denied_models  - never spawned, even if named as default_model.
    # A model denied here stays in platform.models: the roster records platform
    # capability, this records permission.
    #
    # ADOPTER OVERRIDE: an operator sets these per-project without editing the
    # installed plugin, via `<root>/.claude/oj-model-policy.env`, resolved by
    # `oj-helper model-policy`. Same pattern as the existing per-key path
    # overrides in `<root>/.claude/oj-paths.env` (see oj-helper resolve-path).
    # Example, for an org whose procurement has not cleared Fable:
    #   denied_models=claude-fable-5
    allowed_models: []
    denied_models: []

    # Minimum-effort floor. Applied as the LAST step of effort selection: a
    # resolved tier below the floor is raised to it; at or above, unchanged.
    # Lower bound only - never lowers a selection, so escalations still stand.
    # Ordering is routine < implementation < reasoning. `routine` is the
    # identity case (nothing is bumped).
    # Renamed from `min_model_tier`: with one model the floor can no longer
    # raise capability, only depth of reasoning. Same shape, honest name.
    min_effort_tier: "routine"

  hooks:
    - point: "SubagentStart"
      capabilities:
        - "modify_prompt"
        - "add_context"
      matchers:
        - "general-purpose"   # fires for general-purpose agents only (not Bash/Explore/Plan)
    - point: "SessionStart"
      capabilities:
        - "run_command"
      matchers: []            # no agent-type filter; fires for all sessions

  constraints:
    max_concurrent_agents: 5
    # "configured" = tunable recommendation; "hard" = platform-enforced ceiling
    max_concurrent_agents_type: "configured"

    # Thinking cannot be disabled above `high` effort on claude-opus-5: pairing
    # `thinking: {type: "disabled"}` with xhigh or max returns HTTP 400.
    # This is load-bearing here, not trivia. Moderate engagements run at xhigh
    # and Complex at max, so an operator who disables thinking hard-fails every
    # Moderate and Complex engagement. Thinking is ON by default on Opus 5
    # (omitting the parameter runs adaptive), so the default path is safe - the
    # failure only appears if someone opts out explicitly.
    thinking_disable_max_effort: "high"
